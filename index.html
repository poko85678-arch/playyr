<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Небесный Раннер</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* Запрет выделения текста на телефоне */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(59, 89, 152, 0.6);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2639;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Сохраняет пропорции на любых экранах */
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        /* Экран проигрыша */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #game-over-screen h1 {
            color: #e63946;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px #000;
            text-align: center;
        }
        #game-over-screen p {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #game-over-screen button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #4a76a8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #game-over-screen button:hover { background-color: #2b4c73; }
        #game-over-screen button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div id="ui">
            <span>Очки: <span id="score">0</span></span> | 
            <span>Жизни: <span id="lives">3</span></span>
        </div>

        <!-- Экран окончания игры -->
        <div id="game-over-screen">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <p>Ваш счет: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- Определение мобильного устройства ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;

        // --- Настройки игры ---
        let score = 0;
        let lives = 3;
        let gameOver = false;
        
        // На телефоне скорость выше и прыжок сильнее
        let baseSpeed = isMobile ? 7 : 2.5; 
        let gravity = isMobile ? 0.65 : 0.55;
        let jumpPower = isMobile ? -14.5 : -12.5;

        // --- Персонаж ---
        const player = {
            x: 150, 
            y: 300,
            width: 40,
            height: 65,
            vy: 0,
            jumpForce: jumpPower,
            grounded: false,
            jumpCount: 0,
            animTimer: 0
        };

        // --- Мир ---
        let platforms = [];
        let items = []; 
        let particles = []; 

        // --- Управление ---
        let isJumping = false;

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
                if (!isJumping) jump();
                isJumping = true;
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") isJumping = false;
        });

        canvas.addEventListener("mousedown", () => jump());
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        function jump() {
            if (gameOver) return;
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                player.jumpCount = 1;
            } else if (player.jumpCount < 2) {
                player.vy = player.jumpForce * 0.85;
                player.jumpCount++;
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function initGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            
            // Стартовая платформа
            platforms = [{ x: -50, y: 380, width: 600, height: 30 }];
            items = [];
            particles = [];
            player.y = 380 - player.height;
            player.vy = 0;
            player.x = 150;
            
            document.getElementById("game-over-screen").style.display = "none";
            document.getElementById("ui").style.display = "block";
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            initGame();
        }

        // --- Умный спавн предметов СТРОГО НАД ПЛАТФОРМАМИ ---
        function spawnWorld() {
            if (platforms.length < 4) {
                let lastPlat = platforms[platforms.length - 1];
                if (lastPlat.x < canvas.width - 200) {
                    // Расстояние для прыжка (адаптировано под скорость)
                    let gap = isMobile ? Math.random() * 130 + 120 : Math.random() * 100 + 80;
                    let newY = 200 + Math.random() * 150; 
                    
                    if (newY < lastPlat.y - 100) newY = lastPlat.y - 100;
                    if (newY > lastPlat.y + 100) newY = lastPlat.y + 100;
                    
                    let newPlat = {
                        x: lastPlat.x + lastPlat.width + gap,
                        y: newY,
                        width: Math.random() * 80 + 100,
                        height: 25
                    };
                    platforms.push(newPlat);

                    // Предмет ровно над платформой
                    if (Math.random() < 0.6) {
                        let isCola = Math.random() > 0.5;
                        items.push({
                            x: newPlat.x + (newPlat.width / 2) - (isCola ? 10 : 25),
                            y: newPlat.y - 80, 
                            type: isCola ? 'cola' : 'shawarma',
                            width: isCola ? 20 : 50,
                            height: isCola ? 50 : 30,
                            bobbing: Math.random() * Math.PI * 2
                        });
                    }
                }
            }
        }

        // --- Отрисовка Кока-Колы ---
        function drawCola(x, y, w, h) {
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h, w/2, 4, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#2b4a3d"; 
            ctx.beginPath();
            ctx.roundRect(x, y + 15, w, h - 15, 5);
            ctx.fill();

            ctx.fillStyle = "#2b4a3d";
            ctx.fillRect(x + 5, y + 5, w - 10, 15);
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(x + 5, y, w - 10, 5);
            ctx.fillStyle = "#e63946";
            ctx.fillRect(x - 1, y + 20, w + 2, 20);

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(x - 1, y + 30);
            ctx.quadraticCurveTo(x + w/2, y + 35, x + w + 1, y + 25);
            ctx.lineTo(x + w + 1, y + 30);
            ctx.quadraticCurveTo(x + w/2, y + 40, x - 1, y + 35);
            ctx.fill();

            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.fillRect(x + 3, y + 18, 3, h - 25);
        }

        // --- Отрисовка Шаурмы ---
        function drawShawarma(x, y, w, h) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            ctx.rotate(-Math.PI / 6); 
            ctx.scale(0.7, 0.7); 

            let length = w * 1.2; 
            let thickness = h * 1.2; 

            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(0, thickness / 2 + 8, length / 2, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            let lavashGradient = ctx.createLinearGradient(0, -thickness / 2, 0, thickness / 2);
            lavashGradient.addColorStop(0, "#fdfbf7");
            lavashGradient.addColorStop(0.5, "#e8d8b6");
            lavashGradient.addColorStop(1, "#d1b88c");

            ctx.fillStyle = lavashGradient;
            ctx.beginPath();
            ctx.roundRect(-length / 2, -thickness / 2, length, thickness, thickness / 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(139, 69, 19, 0.4)";
            ctx.lineWidth = 3;
            for (let i = 0; i < 6; i++) {
                let grX = -length / 4 + (i * length / 8);
                ctx.beginPath();
                ctx.moveTo(grX, -thickness / 2 + 2);
                ctx.lineTo(grX + 15, thickness / 2 - 2);
                ctx.stroke();
            }

            ctx.fillStyle = "#4a3b32";
            ctx.beginPath();
            ctx.ellipse(-length / 2 + 5, 0, 8, thickness / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#a0522d";
            ctx.beginPath(); ctx.arc(-length / 2 + 8, -10, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-length / 2 + 4, 5, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#8b4513";
            ctx.beginPath(); ctx.arc(-length / 2 + 12, 2, 5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#e63946";
            ctx.fillRect(-length / 2 + 2, 10, 6, 4);
            ctx.fillRect(-length / 2 + 10, 14, 5, 3);

            ctx.strokeStyle = "#8e44ad";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-length / 2 + 3, -15); ctx.quadraticCurveTo(-length / 2 + 8, -12, -length / 2 + 12, -14);
            ctx.moveTo(-length / 2 + 5, 12); ctx.quadraticCurveTo(-length / 2 + 10, 10, -length / 2 + 14, 15);
            ctx.stroke();

            ctx.fillStyle = "#7cb518";
            ctx.beginPath(); ctx.ellipse(-length / 2 + 6, -18, 5, 3, Math.PI/4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-length / 2 + 14, 8, 4, 2, -Math.PI/6, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        // --- Отрисовка ---
        function drawBackground() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#09111c");
            gradient.addColorStop(1, "#1b2a40");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 40;
            ctx.shadowColor = "#e0e1dd";
            ctx.fillStyle = "#e0e1dd";
            ctx.beginPath();
            ctx.arc(650, 100, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawPlayer() {
            let bobY = player.grounded ? Math.sin(player.animTimer) * 3 : 0;
            let px = player.x;
            let py = player.y + bobY;
            
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.beginPath();
            ctx.ellipse(px + player.width/2, player.y + player.height, 22, 6, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#1e293b"; 
            if (player.grounded) {
                let legOffset = Math.sin(player.animTimer) * 8;
                ctx.fillRect(px + 6, py + 45, 10, 15 - legOffset);
                ctx.fillRect(px + 24, py + 45, 10, 15 + legOffset);
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(px + 4, py + 60 - legOffset, 14, 6);
                ctx.fillRect(px + 22, py + 60 + legOffset, 14, 6);
            } else {
                ctx.fillRect(px + 6, py + 45, 10, 18);
                ctx.fillRect(px + 24, py + 45, 10, 18);
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(px + 4, py + 63, 14, 6);
                ctx.fillRect(px + 22, py + 63, 14, 6);
            }

            ctx.fillStyle = "#111"; 
            ctx.beginPath();
            ctx.roundRect(px, py + 18, player.width, 30, 6);
            ctx.fill();

            ctx.fillStyle = "#fce4c5"; 
            ctx.beginPath();
            ctx.arc(px + 20, py + 10, 14, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#fceea7";
            ctx.beginPath();
            ctx.arc(px + 20, py + 6, 15, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = "#4da6ff";
            ctx.fillRect(px + 14, py + 9, 3, 3);
            ctx.fillRect(px + 24, py + 9, 3, 3);
        }

        function drawPlatforms() {
            platforms.forEach(p => {
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.beginPath();
                ctx.roundRect(p.x + 5, p.y + 5, p.width, p.height, 10);
                ctx.fill();
                
                ctx.fillStyle = "#a8c0e0";
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, p.height, 10);
                ctx.fill();
                
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(p.x + 5, p.y - 5, p.width - 10, p.height - 5, 10);
                ctx.fill();
            });
        }

        function drawItems() {
            items.forEach(item => {
                let floatY = Math.sin(item.bobbing) * 3;
                if (item.type === 'cola') {
                    drawCola(item.x, item.y + floatY, item.width, item.height);
                } else if (item.type === 'shawarma') {
                    drawShawarma(item.x, item.y + floatY, item.width, item.height);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.vy += 0.1;
                if (p.life <= 0) { particles.splice(index, 1); return; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        // --- Логика ---
        function update() {
            if (gameOver) return;

            player.vy += gravity;
            player.y += player.vy;
            player.animTimer += 0.2;

            platforms.forEach((p, index) => {
                p.x -= baseSpeed;
                if (p.x + p.width < 0) platforms.splice(index, 1);

                if (player.vy > 0 &&
                    player.x + player.width > p.x && player.x < p.x + p.width &&
                    player.y + player.height > p.y && player.y + player.height < p.y + p.height + 15) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                    player.jumpCount = 0;
                }
            });

            if (player.y > canvas.height) loseLife();

            items.forEach((item, index) => {
                item.x -= baseSpeed;
                item.bobbing += 0.1;

                let hitboxOffset = 10;
                if (player.x < item.x + item.width + hitboxOffset && 
                    player.x + player.width > item.x - hitboxOffset &&
                    player.y < item.y + item.height + hitboxOffset && 
                    player.y + player.height > item.y - hitboxOffset) {
                    
                    score += (item.type === 'cola') ? 10 : 20;
                    createParticles(item.x + item.width/2, item.y + item.height/2, "#ffd700", 10);
                    items.splice(index, 1);
                    updateUI();
                }
                if (item.x + item.width < 0) items.splice(index, 1);
            });

            spawnWorld();
            drawParticles();
        }

        function loseLife() {
            lives--;
            updateUI();
            if (lives <= 0) {
                gameOver = true;
                document.getElementById("final-score").innerText = score;
                document.getElementById("game-over-screen").style.display = "flex";
                document.getElementById("ui").style.display = "none";
            } else {
                player.y = 100;
                player.vy = 0;
                player.x = 150;
                platforms = [{ x: -50, y: 380, width: 600, height: 30 }];
                items = [];
            }
        }

        function updateUI() {
            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;
        }

        function gameLoop() {
            if (gameOver) return;

            drawBackground();
            drawPlatforms();
            drawItems();
            drawPlayer();
            update();
            
            requestAnimationFrame(gameLoop);
        }

        // Запуск при загрузке страницы
        window.onload = () => {
            initGame();
        };

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x+r, y);
                this.arcTo(x+w, y,   x+w, y+h, r);
                this.arcTo(x+w, y+h, x,   y+h, r);
                this.arcTo(x,   y+h, x,   y,   r);
                this.arcTo(x,   y,   x+w, y,   r);
                this.closePath();
                return this;
            }
        }
    </script>
</body>
</html>
